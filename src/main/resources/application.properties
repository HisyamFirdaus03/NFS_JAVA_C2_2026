spring.application.name=AssetTracker

server.port=${SERVER_PORT:8080}

# MongoDB connection (support_desk_db). Correct Spring Boot prefix is
# spring.data.mongodb.* (not spring.mongodb.*, which Spring Boot ignores).
# Full URI form (username/password in the string):
#   spring.data.mongodb.uri=mongodb://supportDeskApp:<password>@localhost:27017/support_desk_db?authSource=support_desk_db
# We keep the password OUT of this file and read it from environment variables.
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:support_desk_db}
spring.data.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:support_desk_db}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}

spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

logging.level.root=INFO
logging.level.com.example.assettracker=DEBUG