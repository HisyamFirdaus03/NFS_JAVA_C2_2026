spring.application.name=AssetTracker

server.port=${SERVER_PORT:8080}

# MongoDB connection (support_desk_db). Use the full URI so credentials are
# actually applied (the individual spring.data.mongodb.username/password
# properties did not build a credential on Spring Boot 4.x).
# The password is kept OUT of this file: provide the whole URI via MONGODB_URI.
#   export MONGODB_URI='mongodb://supportDeskApp:<password>@localhost:27017/support_desk_db?authSource=support_desk_db'
# The default below (no credentials) is only for a MongoDB with auth disabled.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/support_desk_db}
spring.data.mongodb.database=${MONGODB_DATABASE:support_desk_db}

spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

logging.level.root=INFO
logging.level.com.example.assettracker=DEBUG