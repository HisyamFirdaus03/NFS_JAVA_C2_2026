<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Browser</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        #statusText { color: #555; font-style: italic; }
        #eventList li { margin-bottom: 0.5rem; }
        .controls { margin: 1rem 0; }
        button, input { padding: 0.4rem 0.7rem; font-size: 1rem; }
    </style>
</head>
<body>
<h1>Available Events</h1>

<div class="controls">
    <button id="loadButton">Load Events</button>
</div>

<!-- Challenge: search one event by ID -->
<div class="controls">
    <input type="text" id="searchInput" placeholder="Event ID e.g. EV001">
    <button id="searchButton">Find Event</button>
</div>

<p id="statusText">No request sent yet.</p>

<ul id="eventList"></ul>

<script src="app.js"></script>
</body>
</html>
